# Builds Nordpress once, from an empty site, and publishes it as the
# "platform-build" release, which install.sh and the hosted platform
# (platform/) download, so servers never build Next.js themselves. Then
# runs the installer with it on a clean server.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nordpress
          POSTGRES_PASSWORD: nordpress
          POSTGRES_DB: nordpress
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nordpress"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://nordpress:nordpress@localhost:5432/nordpress
      BETTER_AUTH_SECRET: build-only-secret-not-used-by-any-site-0123
      BETTER_AUTH_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - run: pnpm build
      - name: Leave out caches and traces
        run: rm -rf .next/cache .next/dev .next/trace*

      - name: Publish the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf nordpress-build.tar.gz .next
          echo "$GITHUB_SHA" > nordpress-build.sha
          gh release view platform-build >/dev/null 2>&1 ||
            gh release create platform-build --prerelease --title "Platform build" \
              --notes "The current build for hosted sites. Replaced on every push to main."
          # The archive first, so the .sha never names a build that isn't there yet
          gh release upload platform-build nordpress-build.tar.gz --clobber
          gh release upload platform-build nordpress-build.sha --clobber

  # The one-command installer, as a new server owner runs it: no Docker,
  # with this commit's build, HTTPS through Caddy (a local certificate for
  # "localhost"), and either the built-in database or a PostgreSQL server
  installer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [embedded, postgres]
    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'pgvector/pgvector:pg17' || '' }}
        env:
          POSTGRES_USER: nordpress
          POSTGRES_PASSWORD: nordpress
          POSTGRES_DB: nordpress
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nordpress"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          if [ "${{ matrix.db }}" = postgres ]; then
            export DATABASE_URL=postgres://nordpress:nordpress@localhost:5432/nordpress
          fi
          sudo --preserve-env=DATABASE_URL DOMAIN=localhost ./install.sh
      - name: Check the site over HTTPS
        run: |
          set -e
          systemctl is-active nordpress nordpress-caddy
          test "$(cat /opt/nordpress/app/.version)" = "$GITHUB_SHA"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/install)" = "200"
          curl -sk https://localhost/robots.txt | grep -q "Content-Signal"
          # Only Caddy is reachable from outside; the site listens on 127.0.0.1
          sudo ss -ltnp | grep ':3000 ' | grep -q '127.0.0.1'
          if [ "${{ matrix.db }}" = embedded ]; then
            sudo test -f /opt/nordpress/data/db/PG_VERSION
            sudo journalctl -u nordpress --no-pager | grep -q "built-in database"
          else
            ! sudo journalctl -u nordpress --no-pager | grep -q "built-in database"
          fi
      - name: Restart (the database stays)
        run: |
          sudo systemctl restart nordpress
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/install || true)
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          echo "last answer: $code"
          exit 1
      - name: Run it again (nothing to upgrade, settings kept)
        run: |
          set -e
          before=$(sudo grep BETTER_AUTH_SECRET /opt/nordpress/.env)
          sudo ./install.sh | tee /tmp/again.log
          grep -q "up to date" /tmp/again.log
          test "$before" = "$(sudo grep BETTER_AUTH_SECRET /opt/nordpress/.env)"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/install)" = "200"
      - if: failure()
        run: |
          sudo tail -60 /var/log/nordpress-install.log || true
          sudo journalctl -u nordpress -u nordpress-caddy --no-pager | tail -100
