# Builds Nordpress once, from an empty site, and publishes it two ways:
#  - the image ghcr.io/aleksandarsest/nordpress, which install.sh and
#    docker-compose.yml run (tagged "latest" only after the installer works
#    with it);
#  - the "platform-build" release, for the hosted platform (platform/).
# Servers never build Next.js themselves.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/aleksandarsest/nordpress

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nordpress
          POSTGRES_PASSWORD: nordpress
          POSTGRES_DB: nordpress
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nordpress"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://nordpress:nordpress@localhost:5432/nordpress
      BETTER_AUTH_SECRET: build-only-secret-not-used-by-any-site-0123
      BETTER_AUTH_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - run: pnpm build
      - name: Leave out caches and traces
        run: rm -rf .next/cache .next/dev .next/trace*

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          build-contexts: template=.next
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Nordpress: a WordPress-style CMS with AI built in
            org.opencontainers.image.licenses=MIT

      - name: Platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf nordpress-build.tar.gz .next
          echo "$GITHUB_SHA" > nordpress-build.sha
          gh release view platform-build >/dev/null 2>&1 ||
            gh release create platform-build --prerelease --title "Platform build" \
              --notes "The current build for hosted sites. Replaced on every push to main."
          # The archive first, so the .sha never names a build that isn't there yet
          gh release upload platform-build nordpress-build.tar.gz --clobber
          gh release upload platform-build nordpress-build.sha --clobber

  # The one-command installer, as a new server owner runs it, with this
  # image and HTTPS through Caddy (a local certificate for "localhost")
  installer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [embedded, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install
        run: sudo DOMAIN=localhost DB=${{ matrix.db }} NORDPRESS_IMAGE=${{ env.IMAGE }}:${{ github.sha }} ./install.sh
      - name: Check the site over HTTPS
        run: |
          set -e
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/install)" = "200"
          curl -sk https://localhost/robots.txt | grep -q "Content-Signal"
          # The ready build was used, not built here
          sudo docker compose logs app | grep -q "Setting up this version"
          ! sudo docker compose logs app | grep -q "Building Nordpress"
          # Only Caddy is reachable from outside; the app listens on 127.0.0.1
          sudo ss -ltn | grep ':3000 ' | grep -q '127.0.0.1'
          # The chosen database, and nothing else
          if [ "${{ matrix.db }}" = embedded ]; then
            sudo docker compose logs app | grep -q "built-in database"
            ! sudo docker compose ps --services | grep -qx db
          else
            sudo docker compose ps --services | grep -qx db
          fi
      - name: Restart (the database stays)
        run: |
          set -e
          if [ "${{ matrix.db }}" = embedded ]; then
            sudo docker compose exec -T app test -f /app/storage/db/PG_VERSION
          fi
          sudo docker compose restart app
          for i in $(seq 1 60); do
            curl -sk -o /dev/null https://localhost/login && break
            sleep 2
          done
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/install)" = "200"
      - name: Run it again (upgrade keeps the settings)
        run: |
          before=$(sudo grep BETTER_AUTH_SECRET .env)
          sudo NORDPRESS_IMAGE=${{ env.IMAGE }}:${{ github.sha }} ./install.sh
          test "$before" = "$(sudo grep BETTER_AUTH_SECRET .env)"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/install)" = "200"
      - if: failure()
        run: |
          sudo tail -50 /var/log/nordpress-install.log || true
          sudo docker compose logs | tail -200

  latest:
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: docker buildx imagetools create -t ${{ env.IMAGE }}:latest ${{ env.IMAGE }}:${{ github.sha }}
