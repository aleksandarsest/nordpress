# The build hosted sites run (see platform/README.md). The server is too
# small to build Next.js, so it's built here, from an empty site, and
# published as the "platform-build" release for `np-platform template`.
name: Platform build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: platform-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nordpress
          POSTGRES_PASSWORD: nordpress
          POSTGRES_DB: nordpress
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nordpress"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://nordpress:nordpress@localhost:5432/nordpress
      BETTER_AUTH_SECRET: build-only-secret-not-used-by-any-site-0123
      BETTER_AUTH_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - run: pnpm build
      - name: Package the build
        run: |
          tar -czf nordpress-build.tar.gz --exclude=.next/cache --exclude=.next/dev --exclude='.next/trace*' .next
          echo "$GITHUB_SHA" > nordpress-build.sha
          ls -lh nordpress-build.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view platform-build >/dev/null 2>&1 ||
            gh release create platform-build --prerelease --title "Platform build" \
              --notes "The current build for hosted sites. Replaced on every push to main."
          # The archive first, so the .sha never names a build that isn't there yet
          gh release upload platform-build nordpress-build.tar.gz --clobber
          gh release upload platform-build nordpress-build.sha --clobber
