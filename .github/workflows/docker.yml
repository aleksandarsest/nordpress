# Self-hosting smoke test: docker compose up, exactly as the README says,
# then check the site serves the installer and its public files.
name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cat > .env <<EOF
          SITE_URL=http://localhost:3000
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          EOF
      - run: docker compose up -d --build
      - name: Wait for the first start (migrations and build)
        run: |
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/robots.txt || true)
            if [ "$code" = "200" ]; then echo "up after ~$((i*5))s"; exit 0; fi
            sleep 5
          done
          docker compose logs app | tail -100
          exit 1
      - name: Check the site
        run: |
          set -e
          curl -sf http://localhost:3000/robots.txt | grep -q "Content-Signal"
          # A fresh install sends visitors to the installer
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/install)" = "200"
          curl -sf http://localhost:3000/install | grep -qi "install"
          curl -sf http://localhost:3000/.well-known/oauth-authorization-server | grep -q '"token_endpoint"'
      - name: Restart without rebuilding
        run: |
          docker compose restart app
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/robots.txt; then echo "back after ~$((i*2))s"; exit 0; fi
            sleep 2
          done
          docker compose logs app | tail -50
          exit 1
      - if: failure()
        run: docker compose logs | tail -200
