# nginx in front of the platform: aleksa.me (signup, accounts) and every
# name.aleksa.me site. Copy to /etc/nginx/sites-available/, link it into
# sites-enabled, and remove the old aleksa.me server block first.
#
# The certificate covers aleksa.me and *.aleksa.me (certbot with the
# DigitalOcean DNS plugin; see platform/README.md). Subdomains that already
# have their own server block (other apps on this server) keep working:
# nginx prefers an exact server_name over the wildcard.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name aleksa.me *.aleksa.me;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name aleksa.me *.aleksa.me;

  ssl_certificate     /etc/letsencrypt/live/aleksa.me-wildcard/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/aleksa.me-wildcard/privkey.pem;

  client_max_body_size 50m;

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_buffering off;
    # Room for large response headers (cookies, links)
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
  }
}
