# The hosted platform: one Postgres for everything, the platform service, and
# a network the per-site containers join. See platform/README.md.
#   docker compose -f platform/docker-compose.yml --env-file platform/.env up -d

services:
  np-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nordpress
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in platform/.env}
      POSTGRES_DB: platform
    volumes:
      - np-db:/var/lib/postgresql/data
    networks: [np-sites]
    # No published port: only the platform and the sites reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordpress -d platform"]
      interval: 5s
      retries: 20

  platform:
    image: ${NORDPRESS_IMAGE:-nordpress:latest}
    restart: unless-stopped
    entrypoint: ["node", "platform/src/server.ts"]
    depends_on:
      np-db:
        condition: service_healthy
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-aleksa.me}
      PORT: 3100
      PLATFORM_SECRET: ${PLATFORM_SECRET:?set PLATFORM_SECRET in platform/.env}
      PLATFORM_DATABASE_URL: postgres://nordpress:${DB_PASSWORD}@np-db:5432/platform
      ADMIN_DATABASE_URL: postgres://nordpress:${DB_PASSWORD}@np-db:5432/postgres
      NORDPRESS_IMAGE: ${NORDPRESS_IMAGE:-nordpress:latest}
      MAX_SITES: ${MAX_SITES:-10}
      SITE_MEMORY_MB: ${SITE_MEMORY_MB:-450}
      RESERVED_SUBDOMAINS: ${RESERVED_SUBDOMAINS:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # Creates and runs the site containers
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [np-sites]
    # Only nginx on the host talks to it
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  np-db:

networks:
  np-sites:
    name: np-sites
