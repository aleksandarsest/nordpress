# Nordpress with its built-in database: one container (plus Caddy for
# HTTPS), no database server. The database lives in the "db-files" volume.
#   1. Create a .env file next to this one (see "Self-hosting" in the README)
#   2. docker compose -f docker-compose.embedded.yml up -d
#   3. Open SITE_URL and follow the installer
# install.sh sets COMPOSE_FILE=docker-compose.embedded.yml in .env, so plain
# `docker compose` commands use this file.
services:
  app:
    # The published image has a ready build; `docker compose up --build`
    # builds from this checkout instead
    image: ${NORDPRESS_IMAGE:-ghcr.io/aleksandarsest/nordpress:latest}
    build: .
    restart: unless-stopped
    ports:
      # install.sh sets APP_BIND=127.0.0.1, so only Caddy or your web server reaches it
      - "${APP_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${SITE_URL:-http://localhost:3000}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      SITE_NAME: ${SITE_NAME:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - build:/app/.next
      - uploads:/app/storage/uploads
      - backups:/app/storage/backups
      - db-files:/app/storage/db

  # HTTPS with automatic certificates, for SITE_DOMAIN. On with
  # COMPOSE_PROFILES=https in .env (install.sh sets it).
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-files:
  build:
  uploads:
  backups:
  caddy-data:
  caddy-config:
